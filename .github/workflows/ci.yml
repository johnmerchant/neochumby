# Every push and pull request, on GitHub's own runners: formatting, lints
# and tests on the host, and every binary built for both of its targets
# (the Chumby's ARM926 and neochumbyd's x86_64), with TLS and with Noise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0

jobs:
  host:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The crates that build for the host: the protocol, neochumbyd, the
      # manifest tool, the system calls, the macros, AirPlay's companion,
      # and neochumby-classic's engine (its host build renders frames to
      # files).
      - run: cargo clippy --all-targets -p neochumby-proto -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic -- -D warnings
      - run: cargo clippy -p neochumby-airplay --bin neochumby-airplay-companion -- -D warnings
      - run: cargo test -p neochumby-proto -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic
      - run: cargo test -p neochumby-proto --features noise
      - run: cargo test -p neochumby-airplay --bin neochumby-airplay-companion

  cross:
    name: Build for the Chumby and the server (${{ matrix.proto }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proto: [tls, noise]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi, x86_64-unknown-linux-musl
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Features
        run: |
          if [ "${{ matrix.proto }}" = noise ]; then
            echo "FEATURES=--features neochumby-proto/noise" >> "$GITHUB_ENV"
          fi
      # Every app, not just the default tree's.
      - name: The Chumby's binaries
        run: |
          cargo clippy --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake -p neochumby-classic \
            -- -D warnings
          cargo build --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake -p neochumby-classic
      - name: The server's binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES -p neochumbyd
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES \
            -p neochumby-airplay --bin neochumby-airplay-companion
      - name: A tree, as tools/tree lays it out
        if: matrix.proto == 'tls'
        run: tools/tree "$RUNNER_TEMP/tree" doom quake airplay classic && find "$RUNNER_TEMP/tree" -type f | sort
      # That tree booted as a Chumby would, under qemu-arm (dev/emulate):
      # the home screen, a tap on DOOM, the devices, the corner hold, CHUMBY
      # MODE, and a boot from a stick image.
      - name: The tree under dev/emulate
        if: matrix.proto == 'tls'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-user-binfmt dosfstools
          sudo dev/emulate-smoke "$RUNNER_TEMP/tree" "$RUNNER_TEMP/smoke"
      # neochumby-classic as the start app, with pictures from that
      # repository's offline smoke render (made-up data, placeholder art).
      # Its own checks are its CI's business: only the pictures are used.
      - name: neochumby-classic under dev/emulate
        if: matrix.proto == 'tls'
        timeout-minutes: 5
        env:
          CLASSIC_REPO: https://github.com/phoozle/neochumby-classic
          CLASSIC_REV: ae86c465db81e18ed8c511878c4fbc8dc8dafdbf
        run: |
          git clone -q "$CLASSIC_REPO" "$RUNNER_TEMP/nc"
          git -C "$RUNNER_TEMP/nc" checkout -q "$CLASSIC_REV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q Pillow segno
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/nc/tests/smoke.py" --out "$RUNNER_TEMP/pictures" > "$RUNNER_TEMP/render.log" 2>&1 || true
          sudo dev/emulate-classic "$RUNNER_TEMP/tree" "$RUNNER_TEMP/pictures" "$RUNNER_TEMP/classic"
