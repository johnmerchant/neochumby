# Every push and pull request, on GitHub's own runners: formatting, lints
# and tests on the host, and every binary built for both of its targets
# (the Chumby's ARM926 and neochumbyd's x86_64). Noise (neochumby-proto's
# noise` feature) is neither built nor tested here. The dist image (our
# Linux: 5.9.16 and the stable track; mainline weekly, below) built, or
# restored when its inputs haven't changed, and the end-to-end scenarios
# run on it (5.9.16), on qemu-chumby's emulated Chumby. And,
# when the image, the sideloader or the emulator changes (or on demand), the
# sideload image's recovery path tested. The SDK crates packaged as
# crates.io would take them, and, from main, those that changed published
# (see CONTRIBUTING.md).
#
# The images, prebuilt: the dist image for each kernel (5.9.16, stable,
# and mainline from its own runs) and the classic image (2.6.16), each with
# its corresponding source. The
# package job packs them on every run; on main (a push, or a manual run
# with `publish`), the prebuilt job attests them (actions/attest-build-
# provenance) and puts the new ones on the rolling `dist-prebuilt`
# prerelease, named after their inputs commit (the last commit that changed
# what the image is built from: dist/fetch --inputs), which dist/fetch and
# classic/fetch download and verify. Pull requests pack them and publish
# nothing.
#
# A dated release (vYYYY.MM.N, on a commit on main) builds nothing: the
# release job copies that commit's attested images and sources from
# `dist-prebuilt` to it, waiting a while for main's run if they're not
# there yet. It runs on `gh release create vYYYY.MM.N --generate-notes`
# (CONTRIBUTING.md, "Releases"), or by hand with `release`, which creates
# the release itself; then every other job is skipped.
#
# Weekly (schedule), or by hand with `mainline`, the mainline track alone:
# built at the head of the branch, its recovery test and boot scenario run,
# and on main published to `dist-prebuilt` as the others are; the jobs it
# doesn't need are skipped. Pushes and pull requests leave mainline out,
# but for a change to mainline alone (dist/kernel/mainline/, its defconfig)
# or kernel-sync's bump of it (kernel-sync/mainline), which build and test
# it with the others. Between its builds, dist/fetch --kernel mainline
# falls back to the newest one. A dated release leaves it out.
#
# Daily (schedule), or by hand with `kernel_sync`, the kernel-sync job
# checks the stable and mainline tracks' pins against kernel.org and, when
# either has moved, verifies the new version and opens (or updates) a pull
# request of the bump, kernel-sync/TRACK (dist/kernel-sync); then every
# other job is skipped. That pull request's CI says whether the patches
# still apply and the image boots. Nothing is merged but by hand.
#
# What the build takes in (the supply-chain job, deny.toml): every crate's
# licence and source, and every commit for secrets (gitleaks), on every
# push and pull request; RustSec's advisories daily, and when Cargo.lock or
# deny.toml changes (the advisories job).
#
# The jobs that boot the emulator take qemu-chumby's own prebuilt
# qemu-system-arm for the commit the submodule pins (emu/qemu/fetch: from
# its `prebuilt` release, checked against the SHA-256 committed in
# emu/qemu/qemu-chumby.sha256), and build it from source with emu/qemu/build
# only when there is none for that commit, as when a pull request moves the
# submodule without re-pinning (emu/qemu/fetch --pin; emu/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # Told apart by github.event.schedule: keep the crons below in step with
  # the jobs' conditions.
  schedule:
    # Daily: kernel.org's stable and mainline (the kernel-sync job), and
    # RustSec's advisories (the advisories job).
    - cron: '23 4 * * *'
    # Weekly, Sundays: the mainline track's build, tests and publishing.
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      kernel_sync:
        description: Only check the kernel tracks against kernel.org and open or update their bump pull requests (main only); nothing else runs
        type: boolean
        default: false
      publish:
        description: Publish this commit's images on dist-prebuilt (main only), replacing any there
        type: boolean
        default: false
      mainline:
        description: Only build, test and (on main) publish the mainline track's image, as the weekly run does
        type: boolean
        default: false
      release:
        description: Cut a dated release, vYYYY.MM.N, of this commit (main only) from its prebuilt images; nothing else runs
        required: false
        default: ''

permissions:
  contents: read

# A new push to a pull request cancels its runs on the older commits; main's
# runs each finish, so every commit there keeps its result. A release has a
# group of its own, so it never displaces main's run on its commit, and
# so have kernel-sync and mainline's runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.schedule == '23 4 * * *' || inputs.kernel_sync) && 'kernel-sync' || (github.event.schedule == '17 6 * * 0' || inputs.mainline) && format('mainline-{0}', github.ref_name) || github.event.pull_request.number || github.sha }}-${{ github.event.release.tag_name || inputs.release }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a full commit id, with the version it was in a
# comment: a tag can be moved to other code, a commit can't. Tools fetched
# here (cargo-deny, gitleaks) are checked against a SHA-256 pinned here.
env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0
  # The rolling release of prebuilt images, and how many builds of each
  # image (dist 5.9.16, stable and mainline, classic) it keeps, with their
  # sources: each image's own newest, so mainline's weekly builds are kept
  # however many of the others come between.
  PREBUILT_TAG: dist-prebuilt
  PREBUILT_KEEP: 10
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # What the build takes in, on every push and pull request: every crate
  # in Cargo.lock against deny.toml's licences, bans and sources, and every
  # commit for secrets (gitleaks). RustSec's advisories are the next job's,
  # as an advisory published on any day would fail every pull request.
  supply-chain:
    name: Supply chain
    # Not for a release, which builds nothing, nor kernel-sync or mainline's.
    if: github.event_name != 'release' && !inputs.release && github.event_name != 'schedule' && !inputs.kernel_sync && !inputs.mainline
    runs-on: ubuntu-latest
    steps:
      # All history, for gitleaks; the submodules, without which cargo
      # can't load the workspace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - name: cargo-deny and gitleaks, checked against their SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          deny=cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl
          curl -fsSLo deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$deny.tar.gz"
          echo "$CARGO_DENY_SHA256  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz -C bin --strip-components 1 "$deny/cargo-deny"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Dependencies (deny.toml)
        run: cargo deny check bans licenses sources
      - name: Secrets, in every commit
        run: gitleaks git --no-banner --redact --verbose .

  # RustSec's advisories (deny.toml's [advisories]) against Cargo.lock:
  # daily (kernel-sync's schedule, on main), and on a push or pull request
  # that changes Cargo.lock or deny.toml. It isn't a required check: a new
  # advisory fails the day's run on main's Actions, not other people's
  # pull requests.
  advisories:
    name: Advisories (RustSec)
    if: github.event_name != 'release' && !inputs.release && github.event.schedule != '17 6 * * 0' && !inputs.kernel_sync && !inputs.mainline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE...$GITHUB_SHA" | grep -qxE 'Cargo\.lock|deny\.toml'; then
            echo check=true >> "$GITHUB_OUTPUT"
          else
            echo check=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.check == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - name: cargo-deny, checked against its SHA-256
        if: steps.diff.outputs.check == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          deny=cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl
          curl -fsSLo deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$deny.tar.gz"
          echo "$CARGO_DENY_SHA256  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz -C bin --strip-components 1 "$deny/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Advisories
        if: steps.diff.outputs.check == 'true'
        run: cargo deny check advisories

  host:
    name: Format, lint, test
    # Not for a release, which builds nothing, kernel-sync or mainline's runs.
    if: github.event_name != 'release' && !inputs.release && github.event_name != 'schedule' && !inputs.kernel_sync && !inputs.mainline
    runs-on: ubuntu-latest
    steps:
      # The workspace has members in submodules (aquarium's asciiquarium-rs),
      # without which cargo can't load it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Ours, not the third-party crates in submodules that some apps build
      # from (they keep their own formatting).
      - run: cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/third_party/") | not) | "-p " + .name')
      # The crates that build for the host: the protocol, sync's rounds (on
      # both sides, so a temporary directory stands in for the stick),
      # neochumbyd, the manifest tool, the system calls, the macros,
      # AirPlay's companion, its screen and service's memory, and its
      # messages for frontends, and neochumby-classic's engine (its host
      # build renders frames to files).
      - run: cargo clippy --all-targets -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic -- -D warnings
      - run: cargo clippy -p neochumby-airplay --lib --bin neochumby-airplay-companion -- -D warnings
      - run: cargo clippy -p neochumby-airplay --profile test --lib --bin neochumby-airplay-companion -- -D warnings
      - run: cargo clippy --all-targets -p neochumby-airplay-proto -- -D warnings
      # The logs app's text, layout and drawing, and its companion.
      - run: cargo clippy --all-targets -p neochumby-logs -- -D warnings
      - run: cargo test -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic
      - run: cargo test -p neochumby-airplay --lib --bin neochumby-airplay-companion
      - run: cargo test -p neochumby-airplay-proto
      # ncinit, a workspace of its own (Buildroot builds it for the dist
      # image), and the system calls only it uses.
      - run: cargo fmt --check --manifest-path crates/neochumby-init/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path crates/neochumby-init/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path crates/neochumby-init/Cargo.toml
      - run: cargo test -p neochumby-sys --features boot
      - run: cargo test -p neochumby-logs
      # dev/emulate, without firmware or QEMU: the images it makes (through
      # qemu-chumby's chumby_machine) against chumby-image's, and its
      # control path against a stub QEMU.
      - run: python3 dev/test_emulate.py
      # Apps' companions and server programs under uids of their own: the
      # one test that changes uids, so needs root (passwordless sudo on
      # these runners).
      - name: Apps' programs under uids of their own, as root
        run: |
          bin=$(cargo test -p neochumbyd --no-run --message-format=json |
            jq -r 'select(.profile.test and .target.kind == ["bin"]) | .executable')
          sudo "$bin" --ignored --exact isolate::tests::as_root

  cross:
    name: Build for the Chumby and the server
    # Not for a release, which builds nothing, nor kernel-sync. Mainline's
    # runs take the tree, for its boot scenario.
    if: github.event_name != 'release' && !inputs.release && github.event.schedule != '23 4 * * *' && !inputs.kernel_sync
    runs-on: ubuntu-latest
    steps:
      # The apps' third-party C is in submodules (cmake, which builds
      # fetch's fastfetch, is on the runner).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: armv5te-unknown-linux-musleabi, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
          components: clippy
      # Zig's cache (the C it compiles for each target) under a key that
      # changes only with the lockfile: setup-zig's own saves a new copy every
      # run, which fills the repository's cache space and evicts Buildroot's.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-${{ env.ZIG_VERSION }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      # Every app, not just the default tree's.
      - name: The Chumby's binaries
        run: |
          cargo clippy --release --target armv5te-unknown-linux-musleabi \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs -- -D warnings
          cargo build --release --target armv5te-unknown-linux-musleabi \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs
      - name: The server's binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p neochumbyd
          cargo build --release --target x86_64-unknown-linux-musl \
            -p neochumby-airplay --bin neochumby-airplay-companion
          cargo build --release --target x86_64-unknown-linux-musl \
            -p neochumby-logs --bin neochumby-logs-companion
      # The server half for 64-bit ARM Linux too (a Raspberry Pi, say).
      - name: The server's binaries for 64-bit ARM
        run: |
          cargo build --release --target aarch64-unknown-linux-musl -p neochumbyd
          cargo build --release --target aarch64-unknown-linux-musl \
            -p neochumby-airplay --bin neochumby-airplay-companion
          cargo build --release --target aarch64-unknown-linux-musl \
            -p neochumby-logs --bin neochumby-logs-companion
      - name: A tree, as tools/tree lays it out
        run: |
          tools/tree "$RUNNER_TEMP/tree" doom quake airplay fetch htop top \
            cmatrix clock bonsai pipes aquarium genact classic logs
          find "$RUNNER_TEMP/tree" -type f | sort
          cp target/x86_64-unknown-linux-musl/release/neochumbyd "$RUNNER_TEMP/tree.neochumbyd"
      # AirPlay's receiver for the emulator, which has no network.
      - name: The AirPlay stand-in
        run: |
          cargo build --release --target armv5te-unknown-linux-musleabi --manifest-path dev/airplay-standin/Cargo.toml
          cp dev/airplay-standin/target/armv5te-unknown-linux-musleabi/release/neochumby-airplay-standin \
            "$RUNNER_TEMP/tree.airplay-standin"
      # For the end-to-end job. (An artifact keeps no modes: it restores them.)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tree
          path: |
            ${{ runner.temp }}/tree
            ${{ runner.temp }}/tree.neochumbyd
            ${{ runner.temp }}/tree.airplay-standin
          retention-days: 3

  # The SDK crates, packaged as crates.io would take them and each built
  # from its package alone, so that packaging can't break unnoticed. cargo
  # packages them together, so each one's dependencies among them resolve to
  # their packages, not to crates.io. neochumby builds only for the Chumby
  # (and its softfloat and ncurses' C need zig there); the rest build on
  # the host too.
  crates:
    name: Package the SDK crates
    # Not for a release, which builds nothing, kernel-sync or mainline's runs.
    if: github.event_name != 'release' && !inputs.release && github.event_name != 'schedule' && !inputs.kernel_sync && !inputs.mainline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: armv5te-unknown-linux-musleabi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-${{ env.ZIG_VERSION }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: On the host
        run: |
          cargo package -p neochumby-sys -p neochumby-proto -p neochumby-macros \
            -p neochumby-softfloat -p neochumby-sync -p neochumby-ncurses
      - name: For the Chumby, as cargo publish would
        run: |
          cargo publish --dry-run --target armv5te-unknown-linux-musleabi \
            -p neochumby-sys -p neochumby-proto -p neochumby-macros -p neochumby-softfloat \
            -p neochumby-sync -p neochumby -p neochumby-ncurses
      - name: What each carries
        run: |
          for c in target/package/*.crate; do
            printf '%s: %s files, %s bytes\n' "$c" "$(tar tzf "$c" | wc -l)" "$(stat -c %s "$c")"
          done

  # Whether this run needs the sideload job's recovery test and the classic
  # job's boot tests: only when what they test or build changed, on demand,
  # or when there's nothing to compare with (a new branch's first push). A
  # skipped job passes, as a required check too. And which kernels the dist
  # image is built for, as a JSON list: 5.9.16 and stable; with mainline
  # when the change is to it alone or is kernel-sync's bump of it; mainline
  # alone on its weekly (or `mainline`) run.
  changes:
    name: What changed
    # Not for a release, which builds nothing, nor kernel-sync.
    if: github.event_name != 'release' && !inputs.release && github.event.schedule != '23 4 * * *' && !inputs.kernel_sync
    runs-on: ubuntu-latest
    outputs:
      sideload: ${{ steps.diff.outputs.sideload }}
      classic: ${{ steps.diff.outputs.classic }}
      kernels: ${{ steps.diff.outputs.kernels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          MAINLINE_RUN: ${{ github.event.schedule == '17 6 * * 0' || inputs.mainline }}
        run: |
          if [ "$MAINLINE_RUN" = true ]; then
            printf '%s\n' sideload=true classic=false 'kernels=["mainline"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BRANCH" = kernel-sync/mainline ] || { git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --name-only "$BASE...$GITHUB_SHA" | grep -qE '^dist/(kernel/mainline/|configs/chumby_classic_mainline_defconfig$)'; }; then
            echo 'kernels=["5.9.16","stable","mainline"]' >> "$GITHUB_OUTPUT"
          else
            echo 'kernels=["5.9.16","stable"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE...$GITHUB_SHA" | grep -qE '^(dist/|tools/neochumby-kernel-sideloader/|emu/qemu/|\.github/workflows/ci\.yml$)'; then
            echo sideload=true >> "$GITHUB_OUTPUT"
          else
            echo sideload=false >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE...$GITHUB_SHA" | grep -qE '^(classic/|emu/qemu/|\.gitmodules$|\.github/workflows/ci\.yml$)'; then
            echo classic=true >> "$GITHUB_OUTPUT"
          else
            echo classic=false >> "$GITHUB_OUTPUT"
          fi

  # The dist image, dist/build's, for each kernel the changes job names:
  # built when its inputs change, else restored whole, and passed on to the
  # jobs that boot it
  # (dist-image-KERNEL), with its corresponding source, Buildroot's
  # legal-info (dist-source-KERNEL), for the package job. Each kernel has
  # caches of its own. The inputs are those dist/fetch names the image by:
  # keep the hashFiles below in step with its pathspecs.
  dist:
    name: Build the dist image (${{ matrix.kernel }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.changes.outputs.kernels) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEOCHUMBY_DIST_KERNEL: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The image and its source (build/dist/image, build/dist/source).
      - name: Restore the image
        id: image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/dist
          key: neochumby-dist-${{ matrix.kernel }}-image-${{ hashFiles('dist/**', '!dist/README.md', '!dist/fetch', '!dist/kernel-sync', 'crates/neochumby-init/**', 'crates/neochumby-sys/**') }}

      # Buildroot's work, in two: the downloads and ccache, restored from
      # the nearest earlier build whatever changed (this kernel's, else
      # either's: what they share is the same), and the output, only for
      # exactly these inputs (Buildroot can't rebuild cleanly over a changed
      # config, but ccache makes the rebuild cheap). Each is restored here
      # and saved as soon as it's made, not at the end of the job: a later
      # step's failure (or a timeout) would otherwise throw away a long build.
      - name: Restore Buildroot's downloads and ccache
        if: steps.image.outputs.cache-hit != 'true'
        id: dist-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/neochumby-dist/dl
            ${{ runner.temp }}/neochumby-dist/ccache
          key: neochumby-dist-${{ matrix.kernel }}-ccache-${{ hashFiles('dist/**', '!dist/README.md', '!dist/fetch', '!dist/kernel-sync', 'crates/neochumby-init/**', 'crates/neochumby-sys/**') }}
          restore-keys: |
            neochumby-dist-${{ matrix.kernel }}-ccache-
            neochumby-dist-

      - name: Restore Buildroot's output
        if: steps.image.outputs.cache-hit != 'true'
        id: dist-output
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/neochumby-dist/buildroot-*
            ${{ runner.temp }}/neochumby-dist/output
          key: neochumby-dist-${{ matrix.kernel }}-output-${{ hashFiles('dist/**', '!dist/README.md', '!dist/fetch', '!dist/kernel-sync', 'crates/neochumby-init/**', 'crates/neochumby-sys/**') }}

      - name: Build the sideload image
        if: steps.image.outputs.cache-hit != 'true'
        id: dist-build
        env:
          NEOCHUMBY_DIST_WORK: ${{ runner.temp }}/neochumby-dist
        run: dist/build build/dist/image

      # Its corresponding source: Buildroot's legal-info (every target
      # package's source tarball and patches, the licenses, the manifest
      # and the configuration), in the build's own container and work,
      # from the build's downloads.
      - name: Buildroot's legal-info
        if: steps.dist-build.outcome == 'success'
        id: legal-info
        run: |
          docker run --rm -e BR2_DL_DIR=/work/dl -e BR2_CCACHE_DIR=/work/ccache \
            -v "$RUNNER_TEMP/neochumby-dist:/work" -v "$PWD:$PWD" neochumby-dist \
            sh -c 'make -C /work/buildroot-* O=/work/output legal-info'

      # The container writes as root; the cache save runs as the runner.
      - name: Make the Buildroot cache readable
        if: always() && steps.image.outputs.cache-hit != 'true'
        run: sudo chown -R "$USER:$USER" "$RUNNER_TEMP/neochumby-dist" build || true

      # legal-info less what the image doesn't contain or isn't source:
      # the host tools' sources (they build the image; none is in it), the
      # external toolchain's tarball (Bootlin's binaries; what the image has
      # of it is musl, MIT, and GCC's runtime, under its runtime library
      # exception, linked in), and linux-firmware's (a snapshot of the
      # whole firmware tree, hundreds of MB, of which the image has only
      # the rt73's, under its own license, which legal-info keeps in
      # licenses/).
      - name: The source
        if: steps.legal-info.outcome == 'success'
        run: |
          l=$RUNNER_TEMP/neochumby-dist/output/legal-info
          du -sh "$l" "$l"/* "$l"/sources/* 2>/dev/null | sort -h | tail -n 25
          rm -rf build/dist/source
          mkdir -p build/dist/source
          rsync -a --exclude=/host-sources/ \
            --exclude='/sources/toolchain-external-*/' \
            --exclude='/sources/linux-firmware-*/' \
            "$l/" build/dist/source/legal-info/
          {
            echo "The corresponding source of neochumby's dist image (Linux $(dist/build --linux-version), kernel $NEOCHUMBY_DIST_KERNEL)"
            echo
            echo "legal-info/ is Buildroot's \`make legal-info\` for the build: sources/ has"
            echo "the source tarball of every package in the image and the patches applied"
            echo "to it (the kernel's are neochumby's own, dist/patches/linux/ or dist/kernel/), and"
            echo "manifest.csv lists each package, its version, license and source;"
            echo "licenses/ has their license texts; buildroot.config is how it was"
            echo "configured. Rebuild it from neochumby's own source with dist/build, at"
            echo "the inputs commit in this tarball's name (MANIFEST beside the image)."
            echo
            echo "Left out, as not in the image or not source: the host tools' sources"
            echo "(host-sources/), Bootlin's prebuilt toolchain (its musl, MIT, and GCC's"
            echo "runtime, under the GCC Runtime Library Exception, are linked into the"
            echo "programs; Bootlin publishes their source at toolchains.bootlin.com),"
            echo "and the linux-firmware snapshot, of which the image has only the rt73's"
            echo "firmware, a binary under its own license (in licenses/)."
          } > build/dist/source/README
          du -sh build/dist/source

      - name: Save Buildroot's downloads and ccache
        if: always() && steps.image.outputs.cache-hit != 'true' && steps.dist-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/neochumby-dist/dl
            ${{ runner.temp }}/neochumby-dist/ccache
          key: ${{ steps.dist-ccache.outputs.cache-primary-key }}

      # Only a finished build's: its key can't be updated once saved.
      - name: Save Buildroot's output
        if: steps.dist-build.outcome == 'success' && steps.dist-output.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/neochumby-dist/buildroot-*
            ${{ runner.temp }}/neochumby-dist/output
          key: ${{ steps.dist-output.outputs.cache-primary-key }}

      - name: Save the image
        if: steps.legal-info.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/dist
          key: ${{ steps.image.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-image-${{ matrix.kernel }}
          path: build/dist/image
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-source-${{ matrix.kernel }}
          path: build/dist/source
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The end-to-end scenarios (dev/e2e) on qemu-chumby's emulated Chumby,
  # booting the dist image with the tree on a USB stick (dev/emulate's dist
  # profile; never the stock firmware, which runs only locally, on your own:
  # docs/legal.md). Only those that pass on dist so far:
  #   boot      the stick's hook runs the session, which opens home and draws
  #   airplay   AirPlay's text-mode screen, its touches and its sound, with
  #             dev/airplay-standin as the receiver (on classic too)
  # Pending on dist, and why:
  #   smoke     the kernel's framebuffer console blinks its cursor over the
  #             session's screen, so it seldom settles; and the session reads
  #             touches from /dev/input/event0, which on 5.9.16 is the top
  #             button (the touchscreen is event1), so no tap reaches it
  #   classic   its pictures come from NEOCHUMBY_CLASSIC_PICTURES, and it needs
  #             what smoke does, and /dev/switch, which 5.9.16 hasn't
  #   pairing, powercut   need a neochumbyd the Chumby can reach: the
  #             emulated Chumby has no network (-nic none)
  #   stock     the stock firmware: local only
  # The classic profile (Linux 2.6.16 from Chumby's GPL source) is to run
  # them all once its image is built here. Where mainline is built, boot
  # runs on it too; on mainline's own runs, only there.
  e2e:
    name: End-to-end scenarios (dist, classic)
    needs: [changes, cross, dist, classic]
    if: >-
      always() && needs.cross.result == 'success' && needs.dist.result == 'success'
      && (needs.classic.result == 'success' || needs.classic.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: git submodule update --init emu/qemu/qemu-chumby

      # QEMU: qemu-chumby's own build of the commit pinned here, from its
      # prebuilt release, with the SHA-256 committed here (emu/qemu/fetch).
      # When there's none (a pull request moving the submodule without
      # re-pinning, or to a commit not yet on qemu-chumby's main), built
      # from source as before, with its build dependencies (its README has the
      # list), and cached.
      - name: Fetch QEMU
        id: qemu
        run: |
          if emu/qemu/fetch; then
            echo prebuilt=true >> "$GITHUB_OUTPUT"
          else
            echo prebuilt=false >> "$GITHUB_OUTPUT"
          fi

      - name: QEMU build dependencies
        if: steps.qemu.outputs.prebuilt != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libpng-dev zlib1g-dev \
            curl xz-utils patch

      - name: Restore QEMU
        id: qemu-cache
        if: steps.qemu.outputs.prebuilt != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: qemu-chumby-${{ hashFiles('emu/qemu/build', 'emu/qemu/qemu-chumby/**') }}

      - name: Build QEMU
        if: steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: emu/qemu/build

      - name: Save QEMU
        if: steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tree
          path: ${{ runner.temp }}
      # The scenarios run on 5.9.16, the default kernel.
      - if: contains(fromJSON(needs.changes.outputs.kernels), '5.9.16')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-image-5.9.16
          path: build/sideload-dist
      - if: contains(fromJSON(needs.changes.outputs.kernels), 'mainline')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-image-mainline
          path: build/sideload-dist-mainline
      - if: needs.classic.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: classic-image
          path: build/classic

      - name: The tree's modes
        run: |
          find "$RUNNER_TEMP/tree" -type f -path '*/neochumby*' -exec chmod +x {} +
          chmod +x "$RUNNER_TEMP/tree.neochumbyd" "$RUNNER_TEMP/tree.airplay-standin"

      - name: End-to-end scenarios on the dist profile
        if: contains(fromJSON(needs.changes.outputs.kernels), '5.9.16')
        timeout-minutes: 30
        env:
          NEOCHUMBY_EMU_PROFILE: dist
          E2E_SCENARIOS: boot airplay
          NEOCHUMBY_AIRPLAY_STANDIN: ${{ runner.temp }}/tree.airplay-standin
        run: dev/e2e "$RUNNER_TEMP/tree" "$RUNNER_TEMP/tree.neochumbyd" "$RUNNER_TEMP/e2e"

      - name: End-to-end scenarios on the dist profile (mainline)
        if: always() && contains(fromJSON(needs.changes.outputs.kernels), 'mainline')
        timeout-minutes: 30
        env:
          NEOCHUMBY_EMU_PROFILE: dist
          NEOCHUMBY_DIST_KERNEL: mainline
          E2E_SCENARIOS: boot
        run: dev/e2e "$RUNNER_TEMP/tree" "$RUNNER_TEMP/tree.neochumbyd" "$RUNNER_TEMP/e2e-mainline"

      # The same tree on Chumby's own 2.6.16 kernel, built from its GPL
      # source with a BusyBox userspace (classic/): nothing proprietary.
      - name: End-to-end scenarios on the classic profile
        if: always() && needs.classic.result == 'success'
        timeout-minutes: 30
        env:
          NEOCHUMBY_EMU_PROFILE: classic
          E2E_SCENARIOS: boot smoke airplay
          NEOCHUMBY_AIRPLAY_STANDIN: ${{ runner.temp }}/tree.airplay-standin
        run: dev/e2e "$RUNNER_TEMP/tree" "$RUNNER_TEMP/tree.neochumbyd" "$RUNNER_TEMP/e2e-classic"

      # Its screenshots are neochumby's own screens, never the stock software's.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/e2e-mainline
            ${{ runner.temp }}/e2e-classic
          retention-days: 7

  # The sideload image's recovery path: the dist image (each kernel's
  # built) booted on qemu-chumby's machine with a zeroed NAND image, to its
  # shell with NAND loaded. Only when needed.
  sideload:
    name: Test the sideload image's recovery
    needs: [changes, dist]
    if: needs.changes.outputs.sideload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: git submodule update --init emu/qemu/qemu-chumby

      # QEMU: qemu-chumby's own build of the commit pinned here, from its
      # prebuilt release, with the SHA-256 committed here (emu/qemu/fetch).
      # When there's none (a pull request moving the submodule without
      # re-pinning, or to a commit not yet on qemu-chumby's main), built
      # from source as before, with its build dependencies (its README has the
      # list), and cached.
      - name: Fetch QEMU
        id: qemu
        run: |
          if emu/qemu/fetch; then
            echo prebuilt=true >> "$GITHUB_OUTPUT"
          else
            echo prebuilt=false >> "$GITHUB_OUTPUT"
          fi

      - name: QEMU build dependencies
        if: steps.qemu.outputs.prebuilt != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libpng-dev zlib1g-dev \
            curl xz-utils patch

      - name: Restore QEMU
        id: qemu-cache
        if: steps.qemu.outputs.prebuilt != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: qemu-chumby-${{ hashFiles('emu/qemu/build', 'emu/qemu/qemu-chumby/**') }}

      - name: Build QEMU
        if: steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: emu/qemu/build

      - name: Save QEMU
        if: steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}

      - if: contains(fromJSON(needs.changes.outputs.kernels), '5.9.16')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-image-5.9.16
          path: build/sideload-dist
      - if: contains(fromJSON(needs.changes.outputs.kernels), 'stable')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-image-stable
          path: build/sideload-dist-stable
      - if: contains(fromJSON(needs.changes.outputs.kernels), 'mainline')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-image-mainline
          path: build/sideload-dist-mainline

      - name: Recovery end-to-end
        if: contains(fromJSON(needs.changes.outputs.kernels), '5.9.16')
        run: |
          QEMU=$PWD/emu/qemu/out/obj/qemu-system-arm \
          KERNEL=$PWD/build/sideload-dist/sideload-zImage \
          python3 tools/neochumby-kernel-sideloader/run-recovery-demo.py

      # The same on the stable and mainline images: each boots, loads NAND
      # and reports its version, VERSION-mx21-sideload.
      - name: Recovery end-to-end (stable)
        if: always() && contains(fromJSON(needs.changes.outputs.kernels), 'stable')
        run: |
          QEMU=$PWD/emu/qemu/out/obj/qemu-system-arm \
          KERNEL=$PWD/build/sideload-dist-stable/sideload-zImage \
          python3 tools/neochumby-kernel-sideloader/run-recovery-demo.py

      - name: Recovery end-to-end (mainline)
        if: always() && contains(fromJSON(needs.changes.outputs.kernels), 'mainline')
        run: |
          QEMU=$PWD/emu/qemu/out/obj/qemu-system-arm \
          KERNEL=$PWD/build/sideload-dist-mainline/sideload-zImage \
          python3 tools/neochumby-kernel-sideloader/run-recovery-demo.py

  # The open-source 2.6.16 image (classic/): Chumby's GPL kernel and our
  # BusyBox initramfs. Every run uploads it as the classic-image artifact,
  # for other jobs to boot: from a cache of the image itself when its
  # inputs haven't changed (seconds), else built. When they have changed
  # (or the image wasn't cached), it's also booted on the chumby-classic
  # machine, its drivers and devices checked from QMP, then with a stick
  # whose userhook2 it must run. No proprietary firmware anywhere.
  classic:
    name: Open-source 2.6.16 image
    needs: changes
    # Not on mainline's runs.
    if: github.event_name != 'schedule' && !inputs.mainline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # No submodules yet: QEMU's only if it's booted, and the kernel's at
      # its pinned commit only if it's built (classic/build fetches it;
      # `update = none` keeps it out of the other jobs' checkouts).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Inputs of the image
        id: inputs
        run: echo "linux=$(git ls-files -s classic/linux | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # classic/build pins the zig it builds BusyBox with: the same as ours.
      - name: The same zig
        run: |
          zig=$(sed -n 's/^ZIG_VERSION=//p' classic/build)
          [ "$zig" = "$ZIG_VERSION" ] ||
            { echo "::error::classic/build's ZIG_VERSION is $zig, ci.yml's $ZIG_VERSION"; exit 1; }

      # The image alone (a few MB), for exactly these inputs.
      - name: Restore the image
        id: image-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/classic
          key: neochumby-classic-image-${{ steps.inputs.outputs.linux }}-${{ hashFiles('classic/build', 'classic/Containerfile', 'classic/*.fragment', 'classic/initramfs.list', 'classic/patches/**', 'classic/rootfs/**', '!classic/rootfs/init', 'classic/zig-cc', 'classic/*.c') }}

      # classic/build's work (the toolchain, the downloads and the build
      # trees), restored from the nearest earlier build whatever changed:
      # the build checks its inputs and rebuilds what they touch.
      - name: Restore the image's build
        id: classic-cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/neochumby-classic
          key: neochumby-classic-${{ steps.inputs.outputs.linux }}-${{ hashFiles('classic/build', 'classic/Containerfile', 'classic/*.fragment', 'classic/initramfs.list', 'classic/patches/**', 'classic/rootfs/**', '!classic/rootfs/init', 'classic/zig-cc', 'classic/*.c') }}
          restore-keys: neochumby-classic-

      - name: Build the image
        id: classic-build
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          NEOCHUMBY_CLASSIC_WORK: ${{ runner.temp }}/neochumby-classic
        run: classic/build build/classic

      # The container writes as root; the cache saves run as the runner.
      - name: Make the build readable
        if: always() && steps.image-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/neochumby-classic" build/classic || true

      - name: Save the image's build
        if: always() && steps.image-cache.outputs.cache-hit != 'true' && steps.classic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/neochumby-classic
          key: ${{ steps.classic-cache.outputs.cache-primary-key }}

      - name: Save the image
        if: steps.classic-build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/classic
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      # Uploaded before it's tested, so that a later job can use it: the
      # tests below fail this job if it doesn't boot.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classic-image
          path: build/classic/
          if-no-files-found: error

      - name: Whether to boot it
        id: test
        run: |
          if [ "${{ needs.changes.outputs.classic }}" = true ] || [ "${{ steps.image-cache.outputs.cache-hit }}" != true ]; then
            echo boot=true >> "$GITHUB_OUTPUT"
          else
            echo boot=false >> "$GITHUB_OUTPUT"
          fi

      - name: QEMU's submodule
        if: steps.test.outputs.boot == 'true'
        run: git submodule update --init emu/qemu/qemu-chumby

      # The stick's tools.
      - name: mtools and dosfstools
        if: steps.test.outputs.boot == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mtools dosfstools

      # QEMU as the e2e job gets it: prebuilt, else built (and cached).
      - name: Fetch QEMU
        id: qemu
        if: steps.test.outputs.boot == 'true'
        run: |
          if emu/qemu/fetch; then
            echo prebuilt=true >> "$GITHUB_OUTPUT"
          else
            echo prebuilt=false >> "$GITHUB_OUTPUT"
          fi

      - name: QEMU build dependencies
        if: steps.test.outputs.boot == 'true' && steps.qemu.outputs.prebuilt != 'true'
        run: |
          sudo apt-get install -yq --no-install-recommends \
            build-essential python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libpng-dev zlib1g-dev \
            curl xz-utils patch

      # The same cache as the other jobs' QEMU.
      - name: Restore QEMU
        id: qemu-cache
        if: steps.test.outputs.boot == 'true' && steps.qemu.outputs.prebuilt != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: qemu-chumby-${{ hashFiles('emu/qemu/build', 'emu/qemu/qemu-chumby/**') }}

      - name: Build QEMU
        if: steps.test.outputs.boot == 'true' && steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: emu/qemu/build

      - name: Save QEMU
        if: steps.test.outputs.boot == 'true' && steps.qemu.outputs.prebuilt != 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: emu/qemu/out
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}

      - name: Boot it
        if: steps.test.outputs.boot == 'true'
        run: classic/boot-test emu/qemu/out/obj/qemu-system-arm build/classic/classic-zImage --log "$RUNNER_TEMP/console.log"

      # A stick as tools/stick lays one out, with a userhook2 that only
      # reports where it ran: the image's part of running a tree.
      - name: Boot it with a stick
        if: steps.test.outputs.boot == 'true'
        run: |
          printf '#!/bin/sh\necho "hook: on $(uname -r), from $0"\nls /mnt/usb\n' > "$RUNNER_TEMP/userhook2"
          mkfs.vfat -C "$RUNNER_TEMP/stick.img" 16384
          mcopy -i "$RUNNER_TEMP/stick.img" "$RUNNER_TEMP/userhook2" ::userhook2
          classic/boot-test emu/qemu/out/obj/qemu-system-arm build/classic/classic-zImage \
            --stick "$RUNNER_TEMP/stick.img" --want 'hook: on 2.6.16-csb, from /mnt/usb/userhook2' \
            --log "$RUNNER_TEMP/console-stick.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.test.outputs.boot == 'true'
        with:
          name: classic-console
          path: ${{ runner.temp }}/console*.log
          if-no-files-found: ignore

  # The prebuilt images packed for publishing, on every run, so that a pull
  # request checks all of it but the publishing: for each image, its files
  # in the layout its build writes and a MANIFEST, as
  # neochumby-IMAGE-INPUTS-KERNEL.tar.xz, and its corresponding source as
  # neochumby-IMAGE-INPUTS-KERNEL-source.tar, where INPUTS is the last
  # commit that changed what the image is built from (dist/fetch --inputs).
  # The dist image for each kernel built, and the classic image but on
  # mainline's runs.
  package:
    name: Pack the prebuilt images
    needs: [changes, dist, classic]
    if: >-
      always() && needs.dist.result == 'success'
      && (needs.classic.result == 'success' || needs.classic.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      KERNELS: ${{ join(fromJSON(needs.changes.outputs.kernels), ' ') }}
    timeout-minutes: 60
    steps:
      # The whole history: the inputs commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the fetch scripts
        run: |
          shellcheck dist/fetch classic/fetch dist/build
          for k in 5.9.16 stable mainline; do
            echo "dist $k: $(dist/fetch --inputs --kernel "$k"), Linux $(NEOCHUMBY_DIST_KERNEL=$k dist/build --linux-version)"
          done
          echo "classic: $(dist/fetch --inputs --classic)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/in
      - if: needs.classic.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: classic-image
          path: ${{ runner.temp }}/in/classic-image

      # Deterministic tarballs: sorted, owned by root, dated at the inputs
      # commit.
      - name: Pack the dist images
        run: |
          set -euo pipefail
          in=$RUNNER_TEMP/in out=$RUNNER_TEMP/prebuilt stage=$RUNNER_TEMP/stage
          mkdir -p "$out" "$stage"
          br=$(sed -n 's/^VERSION=//p' dist/build)
          for k in $KERNELS; do
            inputs=$(dist/fetch --inputs --kernel "$k")
            linux=$(NEOCHUMBY_DIST_KERNEL=$k dist/build --linux-version)
            t=$(git log -1 --format=%ct "$inputs")
            stem=neochumby-dist-$inputs-$k
            mkdir "$stage/$stem" "$stage/$stem-source"
            cp "$in/dist-image-$k/sideload-zImage" "$in/dist-image-$k/sideload-rootfs.cpio.gz" "$stage/$stem/"
            {
              echo "neochumby's dist image for the Chumby Classic, prebuilt by CI"
              echo "image: dist"
              echo "kernel: $k"
              echo "linux: $linux"
              echo "inputs: $inputs"
              echo "built-from: $GITHUB_SHA"
              echo "buildroot: $br"
              echo "source: $stem-source.tar"
              (cd "$stage/$stem" && sha256sum sideload-zImage sideload-rootfs.cpio.gz)
            } > "$stage/$stem/MANIFEST"
            cp -a "$in/dist-source-$k/." "$stage/$stem-source/"
            tar -C "$stage" --sort=name --mtime="@$t" --owner=0 --group=0 --numeric-owner \
              -cf - "$stem" | xz -T0 -6 > "$out/$stem.tar.xz"
            tar -C "$stage" --sort=name --mtime="@$t" --owner=0 --group=0 --numeric-owner \
              -cf "$out/$stem-source.tar" "$stem-source"
            cat "$stage/$stem/MANIFEST"
          done
          ls -l "$out"

      # The classic image's corresponding source: the kernel at the commit
      # classic/linux pins (Chumby's GPL source, as the build reads it,
      # from git), classic/ (our patches, configuration fragments, rootfs
      # and the build), BusyBox's release tarball, and the notices of what
      # zig links into BusyBox (musl, zig's own libc, compiler-rt), from the
      # zig release classic/build pins. The kernel's compiler (CodeSourcery
      # 2008q3) builds nothing else, and none of it is in the image.
      - name: Pack the classic image
        if: needs.classic.result == 'success'
        run: |
          set -euo pipefail
          in=$RUNNER_TEMP/in stage=$RUNNER_TEMP/stage
          out=$RUNNER_TEMP/prebuilt
          inputs=$(dist/fetch --inputs --classic)
          t=$(git log -1 --format=%ct "$inputs")
          stem=neochumby-classic-$inputs-2.6.16
          src=$stage/$stem-source
          mkdir "$stage/$stem" "$src"
          cp "$in"/classic-image/classic-zImage "$in"/classic-image/classic-rootfs.cpio.gz \
            "$in"/classic-image/classic-config "$stage/$stem/"
          rev=$(git rev-parse HEAD:classic/linux)
          bb=$(sed -n 's/^BUSYBOX_VERSION=//p' classic/build)
          bbsha=$(sed -n 's/^BUSYBOX_SHA256=//p' classic/build)
          zig=$(sed -n 's/^ZIG_VERSION=//p' classic/build)
          zigsha=$(sed -n 's/^ZIG_SHA256_X86_64=//p' classic/build)
          tc=$(sed -n 's/^TOOLCHAIN_URL=//p' classic/build)
          git submodule update --init --checkout --depth 1 classic/linux
          git -C classic/linux archive --format=tar --prefix="linux-2.6.16-chumby-$rev/" "$rev" |
            xz -T0 -6 > "$src/linux-2.6.16-chumby-$rev.tar.xz"
          mkdir "$src/neochumby"
          git archive --format=tar HEAD classic | tar -x -C "$src/neochumby"
          curl -fsSL --retry 3 -o "$src/busybox-$bb.tar.bz2" "https://busybox.net/downloads/busybox-$bb.tar.bz2"
          echo "$bbsha  $src/busybox-$bb.tar.bz2" | sha256sum -c -
          # The notices, from the zig release that built it (LLVM's licence
          # is compiler-rt's, the same text as libunwind's beside it).
          z=zig-x86_64-linux-$zig
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$z.tar.xz" "https://ziglang.org/download/$zig/$z.tar.xz"
          echo "$zigsha  $RUNNER_TEMP/$z.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$z.tar.xz" -C "$RUNNER_TEMP" "$z/LICENSE" "$z/lib/libc/musl/COPYRIGHT" \
            "$z/lib/libunwind/LICENSE.TXT"
          mkdir "$src/licenses"
          cp "$RUNNER_TEMP/$z/LICENSE" "$src/licenses/zig-LICENSE"
          cp "$RUNNER_TEMP/$z/lib/libc/musl/COPYRIGHT" "$src/licenses/musl-COPYRIGHT"
          cp "$RUNNER_TEMP/$z/lib/libunwind/LICENSE.TXT" "$src/licenses/compiler-rt-LICENSE.TXT"
          grep -q 'Apache License' "$src/licenses/compiler-rt-LICENSE.TXT"
          grep -q 'LLVM Exceptions' "$src/licenses/compiler-rt-LICENSE.TXT"
          {
            echo "The corresponding source of neochumby's classic image (Linux 2.6.16)"
            echo
            echo "linux-2.6.16-chumby-$rev.tar.xz: the kernel, Chumby's GPL source for"
            echo "  firmware 1.7.1, at the commit neochumby pins (classic/linux,"
            echo "  https://github.com/johnmerchant/chumby-linux-2.6.16)"
            echo "busybox-$bb.tar.bz2: BusyBox, as released (busybox.net)"
            echo "neochumby/classic/: how they're built: classic/build, the patches"
            echo "  (patches/linux, patches/busybox), the configuration fragments over the"
            echo "  kernel's own .config and BusyBox's defconfig, the initramfs's files and"
            echo "  device list, BusyBox's compiler (zig-cc) and atomics (kuser-atomics.c),"
            echo "  and the build's container"
            echo "licenses/: what BusyBox is linked with statically, by zig $zig"
            echo "  (https://ziglang.org/download/$zig/, whose lib/ is their source):"
            echo "  musl-COPYRIGHT           musl (MIT)"
            echo "  zig-LICENSE              zig's own libc and runtime (MIT)"
            echo "  compiler-rt-LICENSE.TXT  compiler-rt, as zig has it (Apache-2.0 WITH LLVM-exception)"
            echo
            echo "The kernel's compiler, which builds nothing else: $tc"
          } > "$src/README"
          {
            echo "neochumby's classic image for the Chumby Classic, prebuilt by CI"
            echo "image: classic"
            echo "kernel: 2.6.16"
            echo "inputs: $inputs"
            echo "built-from: $GITHUB_SHA"
            echo "linux: chumby-linux-2.6.16 $rev"
            echo "busybox: $bb"
            echo "zig: $zig"
            echo "source: $stem-source.tar"
            (cd "$stage/$stem" && sha256sum classic-zImage classic-rootfs.cpio.gz classic-config)
          } > "$stage/$stem/MANIFEST"
          cat "$stage/$stem/MANIFEST"
          tar -C "$stage" --sort=name --mtime="@$t" --owner=0 --group=0 --numeric-owner \
            -cf - "$stem" | xz -T0 -6 > "$out/$stem.tar.xz"
          tar -C "$stage" --sort=name --mtime="@$t" --owner=0 --group=0 --numeric-owner \
            -cf "$out/$stem-source.tar" "$stem-source"
          tar -tvf "$out/$stem-source.tar"
          ls -l "$out"

      # What a publish from here would add to the release.
      - name: Compare with the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          have=$(gh release view "$PREBUILT_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          cd "$RUNNER_TEMP/prebuilt"
          for f in *; do
            if printf '%s\n' "$have" | grep -qxF "$f"; then
              echo "on $PREBUILT_TAG already: $f"
            else
              echo "new: $f ($(du -h "$f" | cut -f1))"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # The packed images on the rolling dist-prebuilt prerelease (not marked
  # latest), from main only: a push, mainline's weekly run or a manual one
  # with `mainline`, or a manual run with `publish` on a commit on main
  # (which replaces what's there). Only when the images
  # booted (e2e, and the recovery test where it ran). A build already there
  # for the same inputs is left alone; a new one is attested (signed as
  # this workflow on main: what dist/fetch checks), uploaded source first,
  # and the release pruned to the newest PREBUILT_KEEP builds of each image,
  # each with its source.
  prebuilt:
    name: Publish the prebuilt images
    needs: [package, e2e, sideload]
    if: >-
      always() && needs.package.result == 'success' && needs.e2e.result == 'success'
      && (needs.sideload.result == 'success' || needs.sideload.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event.schedule == '17 6 * * 0'
          || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.mainline)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # One at a time: each creates the release if it's missing and prunes it.
    concurrency:
      group: prebuilt
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only commits on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt

      - name: What's new
        id: new
        env:
          REPLACE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          have=$(gh release view "$PREBUILT_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          mkdir -p "$RUNNER_TEMP/new"
          cd "$RUNNER_TEMP/prebuilt"
          for f in *; do
            if [ "$REPLACE" = true ] || ! printf '%s\n' "$have" | grep -qxF "$f"; then
              mv "$f" "$RUNNER_TEMP/new/"
            fi
          done
          ls -l "$RUNNER_TEMP/new"
          if [ -n "$(ls "$RUNNER_TEMP/new")" ]; then
            echo any=true >> "$GITHUB_OUTPUT"
          else
            echo "nothing new: $PREBUILT_TAG has these inputs' builds"
            echo any=false >> "$GITHUB_OUTPUT"
          fi

      - name: Attest
        if: steps.new.outputs.any == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/new/*

      - name: Upload
        if: steps.new.outputs.any == 'true'
        run: |
          cat > "$RUNNER_TEMP/notes" <<EOF
          Prebuilt images of neochumby's Linux for the Chumby Classic, built by CI on main (.github/workflows/ci.yml) and named after their inputs commit, the last commit that changed what the image is built from:

          - \`neochumby-dist-INPUTS-KERNEL.tar.xz\`: the dist image (dist/build: \`sideload-zImage\`, \`sideload-rootfs.cpio.gz\`), KERNEL 5.9.16, stable or mainline (its MANIFEST's \`linux:\` says which version). Mainline is built weekly, so most inputs have none: \`dist/fetch --kernel mainline\` takes the newest then
          - \`neochumby-classic-INPUTS-2.6.16.tar.xz\`: the classic image (classic/build: \`classic-zImage\`, \`classic-rootfs.cpio.gz\`, \`classic-config\`)

          Each has a MANIFEST (its kernel and Linux version, inputs commit and what it was built with), and \`dist/fetch OUT\` (or \`classic/fetch OUT\`) in a checkout downloads the one for its inputs and verifies it. Every asset carries a GitHub artifact attestation; check one with

              gh attestation verify FILE --repo $GH_REPO --cert-identity https://github.com/$GH_REPO/.github/workflows/ci.yml@refs/heads/main

          **Source.** The images contain GPL software (Linux, BusyBox and more). Each image's complete corresponding source is the \`-source.tar\` of the same name beside it: for dist, Buildroot's legal-info (every package's source and patches, licenses, manifest and configuration); for classic, the kernel at its pinned commit, BusyBox, our build, and the licences of what zig links into BusyBox (musl, zig's libc, compiler-rt). neochumby's own source is this repository at the inputs commit. The newest $PREBUILT_KEEP builds of each image are kept, each with its source. No stock Chumby firmware or other proprietary software is in any of them.
          EOF
          if ! gh release view "$PREBUILT_TAG" >/dev/null 2>&1; then
            gh release create "$PREBUILT_TAG" --prerelease --latest=false --target main \
              --title 'Prebuilt images' --notes-file "$RUNNER_TEMP/notes"
          else
            gh release edit "$PREBUILT_TAG" --notes-file "$RUNNER_TEMP/notes"
          fi
          cd "$RUNNER_TEMP/new"
          # The source before its image, so that no image is ever up without it.
          for f in *-source.tar; do [ -e "$f" ] && gh release upload "$PREBUILT_TAG" "$f" --clobber; done
          for f in *.tar.xz; do [ -e "$f" ] && gh release upload "$PREBUILT_TAG" "$f" --clobber; done

      # All but the newest PREBUILT_KEEP builds of each image (by upload
      # time), image and source together.
      - name: Prune
        if: steps.new.outputs.any == 'true'
        run: |
          release=$(gh api "repos/$GH_REPO/releases/tags/$PREBUILT_TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$release/assets?per_page=100" \
            --jq '.[] | [.created_at, .id, .name] | @tsv' | sort -r > "$RUNNER_TEMP/assets"
          python3 - "$RUNNER_TEMP/assets" "$PREBUILT_KEEP" > "$RUNNER_TEMP/prune" <<'EOF'
          import re, sys
          keep, builds = int(sys.argv[2]), {}
          for line in open(sys.argv[1]):
              _, asset, name = line.rstrip("\n").split("\t")
              m = re.fullmatch(r"neochumby-(dist|classic)-([0-9a-f]{40})-([0-9.]+|stable|mainline)(-source\.tar|\.tar\.xz)", name)
              if m:
                  family = builds.setdefault((m[1], m[3]), [])
                  if m[2] not in family:
                      family.append(m[2])  # newest first
                  if family.index(m[2]) >= keep:
                      print(asset, name)
          EOF
          while read -r id name; do
            echo "deleting $name"
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
          done < "$RUNNER_TEMP/prune"

  # A dated release, vYYYY.MM.N (N counting the month's releases from 0),
  # of a commit on main: `gh release create vYYYY.MM.N --generate-notes`
  # (which tags main's head), or a manual run on main with `release`, which
  # creates it the same way. Nothing is built: the commit's images and their
  # sources are copied, the same bytes with the same attestations, from
  # dist-prebuilt, waiting (up to three hours) for main's run on the commit
  # if they aren't there yet. QEMU is qemu-chumby's own release: linked.
  # Mainline isn't in it: built weekly, its builds are seldom of the
  # release's commit, and the notes point to dist-prebuilt for the newest.
  release:
    name: Release ${{ github.event.release.tag_name || inputs.release }}
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version and its commit
        id: version
        run: |
          fail() { echo "::error::$*"; exit 1; }
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)' ||
            fail "$TAG isn't a version: vYYYY.MM.N (v2026.10.0, say)"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          else
            [ "$GITHUB_REF" = refs/heads/main ] || fail "release from main, not $GITHUB_REF"
            commit=$GITHUB_SHA
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$commit" ] ||
                fail "$TAG is already a tag, of another commit"
            fi
          fi
          git merge-base --is-ancestor "$commit" origin/main || fail "$commit isn't on main"
          git checkout -q "$commit"
          [ -x dist/fetch ] || fail "$commit predates the prebuilt images (dist/fetch)"
          {
            echo "commit=$commit"
            echo "dist=$(dist/fetch --inputs)"
            echo "classic=$(dist/fetch --inputs --classic)"
            echo "qemu=$(git rev-parse "$commit:emu/qemu/qemu-chumby")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Wait for the prebuilt images
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          DIST: ${{ steps.version.outputs.dist }}
          CLASSIC: ${{ steps.version.outputs.classic }}
        run: |
          want="neochumby-dist-$DIST-5.9.16 neochumby-dist-$DIST-stable neochumby-classic-$CLASSIC-2.6.16"
          deadline=$(($(date +%s) + 180 * 60))
          while :; do
            # Runs of CI on the commit still going, but this one: checked
            # before the assets, so that a run that finishes in between is
            # seen to have published.
            running=$(gh run list --workflow ci.yml --commit "$COMMIT" --limit 50 --json databaseId,status \
              --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
            have=$(gh release view "$PREBUILT_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=
            for s in $want; do
              for f in "$s.tar.xz" "$s-source.tar"; do
                printf '%s\n' "$have" | grep -qxF "$f" || missing="$missing $f"
              done
            done
            [ -n "$missing" ] || break
            if [ "$running" = 0 ]; then
              echo "::error::$PREBUILT_TAG hasn't$missing, and no CI run on $COMMIT is still going: CI publishes them from main (did its run fail?). Run CI on main with publish, then this again."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$PREBUILT_TAG still hasn't$missing after three hours"
              exit 1
            fi
            echo "waiting for$missing (CI on $COMMIT: $running running)"
            sleep 60
          done
          mkdir "$RUNNER_TEMP/assets"
          for s in $want; do
            gh release download "$PREBUILT_TAG" -D "$RUNNER_TEMP/assets" -p "$s.tar.xz" -p "$s-source.tar"
          done
          echo "WANT=$want" >> "$GITHUB_ENV"

      # The same check as dist/fetch's, before anything is promoted.
      - name: Verify them
        env:
          DIST: ${{ steps.version.outputs.dist }}
          CLASSIC: ${{ steps.version.outputs.classic }}
        run: |
          cd "$RUNNER_TEMP/assets"
          for f in *; do
            gh attestation verify "$f" --repo "$GH_REPO" \
              --cert-identity "https://github.com/$GH_REPO/.github/workflows/ci.yml@refs/heads/main" \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
          for s in $WANT; do
            case $s in neochumby-dist-*) inputs=$DIST ;; *) inputs=$CLASSIC ;; esac
            xz -dc "$s.tar.xz" | tar -xOf - "$s/MANIFEST" | grep -qxF "inputs: $inputs"
          done

      - name: Publish the release
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          DIST: ${{ steps.version.outputs.dist }}
          CLASSIC: ${{ steps.version.outputs.classic }}
          QEMU: ${{ steps.version.outputs.qemu }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$COMMIT" --title "$TAG" --generate-notes
          fi
          cd "$RUNNER_TEMP/assets"
          for f in *-source.tar; do gh release upload "$TAG" "$f" --clobber; done
          for f in *.tar.xz; do gh release upload "$TAG" "$f" --clobber; done
          # Our section of the notes, after whatever was there (GitHub's
          # generated notes), replacing an earlier run's.
          gh release view "$TAG" --json body --jq .body | sed '/^<!-- neochumby: images -->$/,$d' > "$RUNNER_TEMP/notes"
          {
            echo '<!-- neochumby: images -->'
            echo '## Images'
            echo
            echo "Built and attested by CI on main, identical to those on [$PREBUILT_TAG](https://github.com/$GH_REPO/releases/tag/$PREBUILT_TAG). Unpack one and boot it (\`dev/emulate\`, or the kernel sideloader), or let \`dist/fetch OUT\` fetch and verify it from a checkout of $TAG."
            echo
            for s in $WANT; do
              echo "- \`$s.tar.xz\`, with its source, \`$s-source.tar\`"
            done
            echo
            echo "The mainline track's image isn't part of a release: CI builds it weekly, and the newest is on [$PREBUILT_TAG](https://github.com/$GH_REPO/releases/tag/$PREBUILT_TAG) (\`dist/fetch --kernel mainline OUT\` fetches it)."
            echo
            echo "Check one with \`gh attestation verify FILE --repo $GH_REPO --cert-identity https://github.com/$GH_REPO/.github/workflows/ci.yml@refs/heads/main\`."
            echo
            echo "**Source.** The images contain GPL software (Linux, BusyBox and more); each image's complete corresponding source is the \`-source.tar\` beside it, and neochumby's own is this tag."
            echo
            echo '## Emulator'
            echo
            echo "QEMU with the \`chumby-classic\` machine is qemu-chumby's own release: this version pins qemu-chumby [\`${QEMU:0:12}\`](https://github.com/johnmerchant/qemu-chumby/tree/$QEMU), whose builds are \`qemu-chumby-$QEMU-PLATFORM.tar.xz\` on its [prebuilt release](https://github.com/johnmerchant/qemu-chumby/releases/tag/prebuilt) (\`emu/qemu/fetch\` fetches and checks it), or build it with \`emu/qemu/build\`."
          } >> "$RUNNER_TEMP/notes"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes"
          echo "released $TAG: https://github.com/$GH_REPO/releases/tag/$TAG"

  # Publishes the SDK crates to crates.io on every push to main, once main
  # builds, tests and packages: each crate whose package changed since its
  # latest release, and each that depends on one (at 0.0.x every release is
  # incompatible with the one before, so a dependent's requirement changes).
  # Nobody bumps versions: a crate's next version is crates.io's latest plus
  # one in its last component (0.0.N to 0.0.N+1), or its Cargo.toml's version
  # if that's higher (the floor, and a crate's first release). CI writes the
  # versions and requirements into its own checkout's manifests only, and
  # tags each release <crate>-v<version>, as a record. "Changed" means this
  # commit's package, packaged at the latest release's version, differs from
  # the .crate on crates.io (but for .cargo_vcs_info.json and Cargo.lock), so
  # a re-run publishes nothing and a failed run's re-run picks up where it
  # stopped. Anywhere but main (pull requests, workflow_dispatch elsewhere)
  # it only prints the plan and runs cargo publish --dry-run. Runs on main
  # wait for each other: two can't race for one version.
  crates-publish:
    name: Publish to crates.io
    needs: [host, cross, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'crates-io' || format('crates-io-plan-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'publish' || 'dry-run' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: armv5te-unknown-linux-musleabi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: zig-${{ env.ZIG_VERSION }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Plan, and publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        shell: python3 {0}
        run: |
          import io, json, os, re, subprocess, sys, tarfile, time, urllib.error, urllib.request

          # In dependency order; each depends only on those before it.
          SDK = ["neochumby-sys", "neochumby-proto", "neochumby-macros", "neochumby-softfloat",
                 "neochumby-sync", "neochumby", "neochumby-ncurses"]
          TARGET = "armv5te-unknown-linux-musleabi"
          MODE = os.environ["MODE"]
          # crates.io's sparse index and downloads; a directory instead of
          # either tests the plan against crates laid out as they would be.
          INDEX = os.environ.get("CRATES_INDEX", "https://index.crates.io")
          DL = os.environ.get("CRATES_DL", "https://static.crates.io/crates")
          UA = {"User-Agent": "neochumby CI (https://github.com/johnmerchant/neochumby)"}

          def fetch(base, path):
              """The file at base/path, or None if there's none."""
              if not base.startswith("https://"):
                  p = os.path.join(base, path)
                  return open(p, "rb").read() if os.path.exists(p) else None
              req = urllib.request.Request(f"{base}/{path}", headers=UA)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 404):
                          return None
                      err = e
                  except urllib.error.URLError as e:
                      err = e
                  time.sleep(5 * (attempt + 1))
              raise err

          def published(name):
              """Every version of name on crates.io, yanked ones too."""
              n = name.lower()
              path = {1: f"1/{n}", 2: f"2/{n}", 3: f"3/{n[0]}/{n}"}.get(len(n), f"{n[:2]}/{n[2:4]}/{n}")
              body = fetch(INDEX, path)
              return [json.loads(l)["vers"] for l in body.decode().splitlines() if l.strip()] if body else []

          def key(v):
              return tuple(int(x) for x in v.split("-")[0].split("+")[0].split("."))

          def bump(v):
              parts = v.split("-")[0].split("+")[0].split(".")
              parts[-1] = str(int(parts[-1]) + 1)
              return ".".join(parts)

          def run(*cmd, check=True):
              print("+", " ".join(cmd), flush=True)
              return subprocess.run(cmd, check=check)

          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          pkgs = {p["name"]: p for p in meta["packages"] if p["name"] in SDK}
          deps = {c: sorted({d["name"] for d in pkgs[c]["dependencies"] if d["name"] in SDK}, key=SDK.index) for c in SDK}
          for c in SDK:
              assert all(SDK.index(d) < SDK.index(c) for d in deps[c]), f"{c}'s dependencies must come before it in SDK"

          def closure(c):
              """c and every SDK crate it depends on, directly or not."""
              out = {c}
              for d in deps[c]:
                  out.update(closure(d))
              return out

          # The manifests as checked out, and how to write versions into them:
          # each crate's own version, and the requirement in
          # [workspace.dependencies] that its dependents take it by.
          root = os.path.join(meta["workspace_root"], "Cargo.toml")
          texts = {p: open(p).read() for p in [root] + [pkgs[c]["manifest_path"] for c in SDK]}

          def write(versions):
              for p, t in texts.items():
                  if p == root:
                      for c, v in versions.items():
                          t, n = re.subn(rf'(?m)^({re.escape(c)} = \{{ path = "[^"]*", version = )"[^"]*"', rf'\g<1>"{v}"', t)
                          assert n == 1, f"{c} in [workspace.dependencies]"
                  else:
                      c = next(c for c in SDK if pkgs[c]["manifest_path"] == p)
                      if c in versions:
                          head, n = re.subn(r'(?m)^version = "[^"]*"', f'version = "{versions[c]}"', t.split("\n[", 1)[0], count=1)
                          assert n == 1, f"{c}'s [package] version"
                          t = head + t[len(t.split("\n[", 1)[0]):]
                  open(p, "w").write(t)

          def contents(crate):
              """A .crate's files, less what differs between any two packagings."""
              with tarfile.open(fileobj=io.BytesIO(crate), mode="r:gz") as tar:
                  return {m.name.split("/", 1)[1]: tar.extractfile(m).read() for m in tar.getmembers()
                          if m.isfile() and m.name.split("/", 1)[1] not in (".cargo_vcs_info.json", "Cargo.lock")}

          # What to publish, in order: each crate at its latest release's
          # version, and its dependencies at theirs as decided, packaged and
          # compared with that release.
          final, plan = {}, []
          for c in SDK:
              floor = pkgs[c]["version"]
              have = published(c)
              latest = max(have, key=key) if have else None
              if latest is None:
                  final[c], why = floor, "not on crates.io yet"
              elif key(floor) > key(latest):
                  final[c], why = floor, f"its Cargo.toml's version, above {latest}"
              else:
                  write({**final, c: latest})
                  subprocess.run(["cargo", "package", "--no-verify", "--allow-dirty", "--quiet"]
                                 + [a for d in sorted(closure(c), key=SDK.index) for a in ("-p", d)], check=True)
                  mine = contents(open(os.path.join(meta["target_directory"], "package", f"{c}-{latest}.crate"), "rb").read())
                  theirs = contents(fetch(DL, f"{c}/{c}-{latest}.crate"))
                  diff = sorted(f for f in set(mine) | set(theirs) if mine.get(f) != theirs.get(f))
                  if not diff:
                      final[c] = latest
                      print(f"{c} {latest}: unchanged")
                      continue
                  final[c] = bump(latest)
                  if diff == ["Cargo.toml"] and any(d in plan for d in deps[c]):
                      why = "its dependencies' new versions"
                  else:
                      why = f"changed since {latest}: " + ", ".join(diff[:8]) + (f" and {len(diff) - 8} more" if len(diff) > 8 else "")
              plan.append(c)
              print(f"{c} {final[c]}: {why}")
          write(final)

          print()
          if not plan:
              print("Nothing to publish.")
              sys.exit(0)
          print("To publish, in this order:")
          for i, c in enumerate(plan, 1):
              print(f"  {i}. {c} {final[c]}" + (f" (needs {', '.join(f'{d} {final[d]}' for d in deps[c])})" if deps[c] else ""))
          print(flush=True)

          if MODE != "publish":
              # Together, so those not yet on crates.io resolve to their packages.
              run("cargo", "publish", "--dry-run", "--allow-dirty", "--target", TARGET, *[a for c in plan for a in ("-p", c)])
              sys.exit(0)

          if not os.environ.get("CARGO_REGISTRY_TOKEN"):
              sys.exit("::error::No CARGO_REGISTRY_TOKEN secret: nothing published")
          for c in plan:
              v = final[c]
              p = subprocess.run(["cargo", "publish", "--allow-dirty", "--target", TARGET, "-p", c],
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(p.stdout, flush=True)
              if p.returncode != 0:
                  if not re.search(r"already (exists|uploaded)", p.stdout):
                      sys.exit(f"::error::{c} {v} wasn't published")
                  print(f"{c} {v} is already on crates.io")
              # cargo waits for the index too, but only so long: its
              # dependents resolve it from there.
              for _ in range(60):
                  if v in published(c):
                      break
                  time.sleep(10)
              else:
                  sys.exit(f"::error::{c} {v} isn't in crates.io's index")
              tag = f"{c}-v{v}"
              if not subprocess.run(["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"],
                                    stdout=subprocess.DEVNULL).returncode == 0:
                  run("git", "tag", tag)
                  run("git", "push", "origin", f"refs/tags/{tag}")

  # The kernel tracks against kernel.org (https://www.kernel.org/releases.json):
  # daily, and by hand on main with `kernel_sync`, and never otherwise. When
  # stable or mainline has moved, dist/kernel-sync verifies the new version
  # (stable: kernel.org's signed sha256sums.asc and the tarball's own hash;
  # mainline: the tag's signature, by Linus, and dist/build's archive of
  # it), commits the new pin to kernel-sync/TRACK, opens its pull request
  # or updates the one open, and runs CI on it (a push with GITHUB_TOKEN
  # starts none of its own). It never merges. GitHub Actions has to be
  # allowed to create pull requests (Settings, Actions, General).
  kernel-sync:
    name: Kernel tracks against kernel.org
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event.schedule == '23 4 * * *' || (github.event_name == 'workflow_dispatch' && inputs.kernel_sync))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Its own: pushing the bump's branch, its pull request, and CI on it.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The whole history: whose commits a bump branch has, beyond main's.
      # The only checkout that keeps the token: dist/kernel-sync pushes the
      # bump's branch with it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The pins and kernel.org's
        run: dist/kernel-sync check
      - name: Bump pull requests
        run: dist/kernel-sync pr
