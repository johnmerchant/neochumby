# Every push and pull request, on GitHub's own runners: formatting, lints
# and tests on the host, and every binary built for both of its targets
# (the Chumby's ARM926 and neochumbyd's x86_64). Noise (neochumby-proto's
# `noise` feature) is neither built nor tested here. And, when the image,
# the sideloader or the emulator changes (or on demand), the NANDLESS image
# built and its recovery path tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its runs on the older commits; main's
# runs each finish, so every commit there keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0

jobs:
  host:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      # The workspace has members in submodules (aquarium's asciiquarium-rs),
      # without which cargo can't load it.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Ours, not the third-party crates in submodules that some apps build
      # from (they keep their own formatting).
      - run: cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/third_party/") | not) | "-p " + .name')
      # The crates that build for the host: the protocol, sync's rounds (on
      # both sides, so a temporary directory stands in for the stick),
      # neochumbyd, the manifest tool, the system calls, the macros,
      # AirPlay's companion, and neochumby-classic's engine (its host build
      # renders frames to files).
      - run: cargo clippy --all-targets -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic -- -D warnings
      - run: cargo clippy -p neochumby-airplay --bin neochumby-airplay-companion -- -D warnings
      # The logs app's text, layout and drawing, and its companion.
      - run: cargo clippy --all-targets -p neochumby-logs -- -D warnings
      - run: cargo test -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic
      - run: cargo test -p neochumby-airplay --bin neochumby-airplay-companion
      - run: cargo test -p neochumby-logs
      # dev/emulate's full-system machine, without firmware: its images
      # against chumby-emu's, and its control path against a stub QEMU.
      - run: python3 dev/test_emulate.py

  cross:
    name: Build for the Chumby and the server
    runs-on: ubuntu-latest
    steps:
      # The apps' third-party C is in submodules (cmake, which builds
      # fetch's fastfetch, is on the runner).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Every app, not just the default tree's.
      - name: The Chumby's binaries
        run: |
          cargo clippy --release --target armv5te-unknown-linux-musleabi \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs -- -D warnings
          cargo build --release --target armv5te-unknown-linux-musleabi \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs
      - name: The server's binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p neochumbyd
          cargo build --release --target x86_64-unknown-linux-musl \
            -p neochumby-airplay --bin neochumby-airplay-companion
          cargo build --release --target x86_64-unknown-linux-musl \
            -p neochumby-logs --bin neochumby-logs-companion
      # The server half for 64-bit ARM Linux too (a Raspberry Pi, say).
      - name: The server's binaries for 64-bit ARM
        run: |
          cargo build --release --target aarch64-unknown-linux-musl -p neochumbyd
          cargo build --release --target aarch64-unknown-linux-musl \
            -p neochumby-airplay --bin neochumby-airplay-companion
          cargo build --release --target aarch64-unknown-linux-musl \
            -p neochumby-logs --bin neochumby-logs-companion
      - name: A tree, as tools/tree lays it out
        run: |
          tools/tree "$RUNNER_TEMP/tree" doom quake airplay fetch htop top \
            cmatrix clock bonsai pipes aquarium genact classic logs
          find "$RUNNER_TEMP/tree" -type f | sort
      # The end-to-end scenarios (dev/e2e), on that tree booted as a Chumby
      # would be under qemu-arm (dev/emulate's user mode): the home screen,
      # a tap on DOOM, the devices, the corner hold, CHUMBY MODE, a boot
      # from a stick image; pairing through PAIR (a refusal, an approval,
      # --replace, forget); and delivery=sync through a power cut mid-round,
      # paired with this neochumbyd, with the real boot hook. Those on the
      # stock firmware run only locally, on your own (docs/legal.md).
      - name: End-to-end scenarios under dev/emulate
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-user-binfmt dosfstools busybox-static
          sudo dev/e2e "$RUNNER_TEMP/tree" target/x86_64-unknown-linux-musl/release/neochumbyd "$RUNNER_TEMP/e2e"

  # Whether this run needs the NANDLESS job: only when what it builds
  # changed, on demand, or when there's nothing to compare with (a new
  # branch's first push). A skipped job passes, as a required check too.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      nandless: ${{ steps.diff.outputs.nandless }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE...$GITHUB_SHA" | grep -qE '^(dist/|tools/neochumby-kernel-sideloader/|emu/qemu/|\.github/workflows/ci\.yml$)'; then
            echo nandless=true >> "$GITHUB_OUTPUT"
          else
            echo nandless=false >> "$GITHUB_OUTPUT"
          fi

  # The NANDLESS image and its recovery path: the custom QEMU and the
  # Buildroot image built, then the self-contained recovery test run with a
  # zeroed NAND image. The heaviest job, so it runs only when needed.
  nandless:
    name: Build NANDLESS image and test recovery
    needs: changes
    if: needs.changes.outputs.nandless == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # emu/qemu/qemu-chumby's build dependencies (its README has the list).
      - name: QEMU build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libpng-dev zlib1g-dev \
            curl xz-utils patch

      - name: Cache QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: emu/qemu/out
          key: qemu-chumby-${{ hashFiles('emu/qemu/build', 'emu/qemu/qemu-chumby/**') }}

      - name: Build QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: emu/qemu/build

      # Buildroot's downloads, toolchain and output.  A cold cache is slow;
      # later runs rebuild only what changed.
      - name: Cache Buildroot work
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/neochumby-dist
          key: neochumby-dist-${{ hashFiles('dist/build', 'dist/Containerfile', 'dist/configs/**', 'dist/board/**', 'dist/patches/**') }}

      - name: Build the NANDLESS image
        env:
          NEOCHUMBY_DIST_WORK: ${{ runner.temp }}/neochumby-dist
        run: dist/build build/nandless-dist

      - name: Recovery end-to-end
        run: |
          QEMU=$PWD/emu/qemu/out/obj/qemu-system-arm \
          KERNEL=$PWD/build/nandless-dist/nandless-zImage \
          python3 tools/neochumby-kernel-sideloader/run-recovery-demo.py

      # The container writes as root; the cache save runs as the runner.
      - name: Make the Buildroot cache readable
        if: always()
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/neochumby-dist" || true
