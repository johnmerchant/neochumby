# Every push and pull request, on GitHub's own runners: formatting, lints
# and tests on the host, and every binary built for both of its targets
# (the Chumby's ARM926 and neochumbyd's x86_64), with TLS and with Noise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0

jobs:
  host:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The crates that build for the host: the protocol, neochumbyd, and
      # AirPlay's companion.
      - run: cargo clippy -p neochumby-proto -p neochumbyd -p neochumby-manifest -- -D warnings
      - run: cargo clippy -p neochumby-airplay --bin neochumby-airplay-companion -- -D warnings
      - run: cargo test -p neochumby-proto -p neochumbyd -p neochumby-manifest
      - run: cargo test -p neochumby-proto --features noise
      - run: cargo test -p neochumby-airplay --bin neochumby-airplay-companion

  cross:
    name: Build for the Chumby and the server (${{ matrix.proto }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proto: [tls, noise]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi, x86_64-unknown-linux-musl
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Features
        run: |
          if [ "${{ matrix.proto }}" = noise ]; then
            echo "FEATURES=--features neochumby-proto/noise" >> "$GITHUB_ENV"
          fi
      # Every app, not just the default tree's.
      - name: The Chumby's binaries
        run: |
          cargo clippy --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -- -D warnings
          cargo build --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake
      - name: The server's binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES -p neochumbyd
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES \
            -p neochumby-airplay --bin neochumby-airplay-companion
      - name: A tree, as tools/tree lays it out
        if: matrix.proto == 'tls'
        run: tools/tree "$RUNNER_TEMP/tree" doom quake airplay && find "$RUNNER_TEMP/tree" -type f | sort
      # For the emulator job; a tar keeps the binaries executable.
      - name: Keep the tree
        if: matrix.proto == 'tls'
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/tree.tar" tree
      - uses: actions/upload-artifact@v4
        if: matrix.proto == 'tls'
        with:
          name: tree
          path: ${{ runner.temp }}/tree.tar
          retention-days: 3

  emulate:
    name: Boot the tree under dev/emulate
    needs: cross
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tree
          path: ${{ runner.temp }}
      # qemu-user-static registers qemu-arm with binfmt_misc; dosfstools
      # makes the stick image.
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user-static dosfstools
      - run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/tree.tar"
      - run: sudo dev/emulate-smoke "$RUNNER_TEMP/tree" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulate-smoke
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/state/log
            ${{ runner.temp }}/smoke/state/emulate.log
          retention-days: 7
