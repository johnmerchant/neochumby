# dev/emulate's Linux VM on a Mac, for Lima (https://lima-vm.io): user mode
# needs Linux (namespaces, FUSE, binfmt_misc), so on a Mac every dev/emulate
# command runs in here. `dev/emulate vm start` creates it from this file,
# with REPO replaced by this checkout, which is mounted writable at the same
# path so paths mean the same on both sides.
vmType: vz
mountType: virtiofs
images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
cpus: 2
memory: 2GiB
disk: 8GiB
mounts:
  - location: REPO
    writable: true
# Nothing to forward: the emulator is driven through dev/emulate.
portForwards: []
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      # qemu-arm, static, registered with binfmt_misc's F flag; the package
      # is qemu-user-binfmt from Ubuntu 25.04 on.
      apt-get install -yq --no-install-recommends python3 dosfstools fuse3
      apt-get install -yq --no-install-recommends qemu-user-static ||
        apt-get install -yq --no-install-recommends qemu-user-binfmt
