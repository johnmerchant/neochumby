[package]
name = "neochumby-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A test app for the emulator tests: a known screen, and every touch it sees on stderr"

# Built into a tree by tools/tree for the emulator tests only, apart from
# the device workspace.
[workspace]

[dependencies]
neochumby = { path = "../../../crates/neochumby" }

[package.metadata.neochumby]
title = "PROBE"
exec = "neochumby-probe"
colour = "ff00ff"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
