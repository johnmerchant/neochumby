[package]
name = "chumby-emu"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A Chumby Classic (i.MX21) emulator that boots the stock firmware"

# A host tool, built apart from the neochumby workspace (which targets the
# Chumby itself).
[workspace]

[dependencies]

# End-to-end tests on the emulated Chumby, from the developer's own images
# (README.md, "Tests"); skipped without them. Their own runner, which
# reports skips.
[[test]]
name = "scenarios"
harness = false

[profile.release]
opt-level = 3
debug = "line-tables-only"
panic = "abort"
codegen-units = 1
lto = "thin"

[profile.dev]
opt-level = 1
