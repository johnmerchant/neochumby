[package]
name = "neochumby-home"
description = "neochumby's app list: the installed apps, pairing, the time, and back to the Chumby"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-proto.workspace = true
neochumby-sys.workspace = true

[package.metadata.neochumby]
exec = "neochumby-home"
start = true
# It lists every app in the tree and reads the network's name from /psp; in
# text mode, without fb, as its rows fall where they did on the framebuffer
# in Spleen 8x16 (src/main.rs).
access = ["root"]
font = "spleen-8x16"

[lints]
workspace = true
