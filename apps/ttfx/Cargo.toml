[package]
name = "neochumby-ttfx"
description = "ttfx (TerminalTextEffects in Rust) on the Chumby Classic, in text mode, as a neochumby app"
# ttfx is MIT, as TerminalTextEffects is and we are; its LICENSE and NOTICE
# keep TerminalTextEffects' copyright.
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-sys.workspace = true
ttfx = { path = "third_party/ttfx" }
# ttfx's main.rs's.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[package.metadata.neochumby]
title = "TTFX"
exec = "neochumby-ttfx"
# Any line ends it: its terminal is in line mode.
tap = "\n"
font = "spleen-6x12"
# Not on the stock 2.6.16: ttfx sizes its canvas with terminal_size, which
# calls the kernel through rustix, and rustix needs Linux 3.2.
linux = "5.9"
color = "b46ec8"

[lints]
workspace = true
