[package]
name = "neochumby-genact"
description = "genact on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# genact is MIT, as we are.
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
genact = "=1.6.0"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
clap = { version = "4", default-features = false, features = ["std"] }

[package.metadata.neochumby]
title = "GENACT"
exec = "neochumby-genact"
tap = "\n"
# Not on the stock 2.6.16: genact's rand seeds itself with getrandom, which on 2.6.16 waits on
# /dev/random for entropy the Chumby may not have, on a black screen.
linux = "5.9"
color = "3cb464"

[lints]
workspace = true
