[package]
name = "neochumby-airplay-proto"
description = "AirPlay on neochumby, for frontends: what's playing and its controls, as the AirPlay app's receiver and service send them"
license = "MIT"
# Its own semver, not the workspace's: a frontend in another repository
# depends on it, from this repository for now. Not published until the
# first frontend outside it needs it on crates.io; then by hand, by tag,
# as the SDK crates are (CONTRIBUTING.md).
version = "0.1.0"
edition.workspace = true
publish = false
repository.workspace = true

[dependencies]
neochumby-proto.workspace = true
serde.workspace = true
serde_bytes = "0.11"

[lints]
workspace = true
