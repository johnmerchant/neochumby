[package]
name = "neochumby-kernel-sideloader"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Stock Chumby 2.6.16 -> NAND-less Linux 5.9.16 kernel sideloader"

[[bin]]
name = "neochumby-kernel-sideloader"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
strip = false
debug = false

# Standalone: this is a bare-metal ARM binary, not a member of the
# neochumby workspace (which denies unsafe code).
[workspace]

# The main workspace's rule; asm.rs and raw.rs allow it, and it is on
# .github/unsafe-allowed (tools/check-unsafe).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
