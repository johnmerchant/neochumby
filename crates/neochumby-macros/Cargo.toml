[package]
name = "neochumby-macros"
description = "neochumby's macros: an app's companion, checked against its Cargo.toml as it compiles"
license = "MIT"
# Its own semver, not the workspace's: published on crates.io (see
# CONTRIBUTING.md).
version = "0.0.1"
edition.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords = ["chumby", "macros"]
categories = ["development-tools::procedural-macro-helpers", "embedded"]
# What the published crate carries: what it builds from.
include = ["src/**", "README.md", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
toml.workspace = true

[lints]
workspace = true
