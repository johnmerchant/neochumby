[package]
name = "neochumby-wamr"
description = "WAMR, the WebAssembly Micro Runtime, built for the Chumby Classic, with a small safe interface"
# Our Rust is MIT; WAMR and wamr-sys, which this crate links, are
# Apache-2.0 WITH LLVM-exception.
license = "MIT AND Apache-2.0 WITH LLVM-exception"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

# WAMR, built: neochumby's fork of wamr-rust-sdk, pinned (lib.rs says
# why only its sys crate).
[dependencies.wamr-sys]
git = "https://github.com/johnmerchant/wamr-rust-sdk"
rev = "e62c8f89eafc7d3ab1b46b5605a9c9135bc11b1a"
default-features = false
features = ["aot", "fast-interp"]

[dev-dependencies]
wat = "1"

[lints]
workspace = true
