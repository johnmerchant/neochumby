[package]
name = "neochumby-sync"
description = "A Chumby's tree on its stick, kept in step with its neochumbyd"
license = "MIT"
# Its own semver, not the workspace's: published on crates.io (see
# CONTRIBUTING.md).
version = "0.0.1"
edition.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords = ["chumby", "sync", "embedded"]
categories = ["embedded", "filesystem"]
# What the published crate carries: what it builds from.
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
neochumby-proto.workspace = true
neochumby-sys.workspace = true
# SHA-256. Already in every build through neochumby-proto.
ring = "0.17"

[lints]
workspace = true
