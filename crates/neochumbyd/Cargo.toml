[package]
name = "neochumbyd"
description = "What a Chumby pairs with: its apps over NFS, and their server halves"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
neochumby-proto.workspace = true
neochumby-sys.workspace = true
nfsserve = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[lints]
workspace = true

# End to end on loopback. It runs its own binary again as an app's daemon,
# so it has a main of its own rather than the test harness.
[[test]]
name = "daemon"
harness = false
