[package]
name = "neochumbyd"
description = "What a Chumby pairs with: its apps synced to its stick, and their server halves"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby-proto.workspace = true
neochumby-sync.workspace = true
neochumby-sys.workspace = true
png = "0.18"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
# The catalog's .crate files (tar.gz).
flate2 = "1"
tar = { version = "0.4", default-features = false }
toml.workspace = true
# The catalog's HTTPS: pure Rust, rustls on ring (as neochumby-proto's TLS)
# with Mozilla's roots built in, so a static musl binary needs no system
# certificates. No OpenSSL. A wasm companion's HTTPS GETs (wasm.rs,
# egress.rs) use it too.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Verifying the catalog's Sigstore bundles (catalog/sigstore.rs): the
# certificate chain with webpki and the signatures with ring, as rustls
# does; nothing new is built.
base64 = "0.22"
ring = "0.17"
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
# Which catalog version is newer (catalog/update.rs).
semver = "1"

# Wasm companions (wasm.rs): Cranelift, without the cache, profiling or
# the debugger. WASI preview 1 is built on preview 2's host types, which
# bring the component model and async into the build; neither is turned
# on when a companion runs.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "call-hook"], optional = true }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1"], optional = true }

[features]
# Wasm companions, under Wasmtime: some 10 MB of the binary. Release
# builds (CI's) have it. Without it, neochumbyd runs no app's .wasm
# companion, and says why.
wasm-companions = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dev-dependencies]
# Sigstore bundles and a trusted root of the tests' own; the wasm
# companions' tests: WAT, and an HTTPS server on 127.0.0.1.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
wat = "1"

[lints]
workspace = true

# End to end on loopback. It runs its own binary again as an app's server program,
# so it has a main of its own rather than the test harness.
[[test]]
name = "server"
harness = false

# `neochumbyd wasm-companion` as a process: only with Wasmtime.
[[test]]
name = "wasm_companion"
required-features = ["wasm-companions"]
