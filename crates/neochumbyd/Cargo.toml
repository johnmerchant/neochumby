[package]
name = "neochumbyd"
description = "What a Chumby pairs with: its apps over NFS or synced to its stick, and their server halves"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
neochumby-proto.workspace = true
neochumby-sync.workspace = true
neochumby-sys.workspace = true
nfsserve = "0.11"
png = "0.18"
# openat, to walk the tree's paths without following links (nfs.rs). Only on
# the server, never the Chumby: rustix needs Linux 3.2, and the Chumby runs
# 2.6.16.
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
# The catalog's .crate files (tar.gz).
flate2 = "1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml.workspace = true
# The catalog's HTTPS: pure Rust, rustls on ring (as neochumby-proto's TLS)
# with Mozilla's roots built in, so a static musl binary needs no system
# certificates. No OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Verifying the catalog's Sigstore bundles (catalog/sigstore.rs): the
# certificate chain with webpki and the signatures with ring, as rustls
# does; nothing new is built.
base64 = "0.22"
ring = "0.17"
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
# Which catalog version is newer (catalog/update.rs).
semver = "1"

[dev-dependencies]
# Sigstore bundles and a trusted root of the tests' own.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true

# End to end on loopback. It runs its own binary again as an app's server program,
# so it has a main of its own rather than the test harness.
[[test]]
name = "server"
harness = false
