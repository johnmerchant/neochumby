[package]
name = "neochumby"
description = "neochumby: the session and the device library for the Chumby Classic"
license = "MIT"
# Its own semver, not the workspace's: published on crates.io (see
# CONTRIBUTING.md).
version = "0.0.1"
edition.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords = ["chumby", "framebuffer", "embedded", "arm"]
categories = ["embedded", "hardware-support"]
# What the published crate carries: what it builds from, the terminal's
# fonts (Spleen, with its licence) and colour schemes among it.
include = ["src/**", "fonts/**", "themes/**", "README.md", "LICENSE"]

[dependencies]
libc.workspace = true
neochumby-proto.workspace = true
neochumby-macros.workspace = true
neochumby-sync.workspace = true
neochumby-sys.workspace = true
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
# Fb is a DrawTarget: its fonts, shapes and text.
embedded-graphics = "0.8"
vte = "0.15"
neochumby-softfloat = { workspace = true, optional = true }

[features]
default = ["softfloat"]
# libgcc's ARM soft float for every app's float arithmetic (GPL-3.0 with the
# GCC Runtime Library Exception: no obligations on the programs it is in).
softfloat = ["dep:neochumby-softfloat"]

[lints]
workspace = true
