[package]
name = "neochumby-proto"
description = "How a Chumby and its neochumbyd talk: TLS 1.3 over TCP or a serial line"
license = "MIT"
# Its own semver, not the workspace's: published on crates.io (see
# CONTRIBUTING.md).
version = "0.0.1"
edition.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords = ["chumby", "protocol", "tls", "pairing"]
categories = ["network-programming", "embedded"]
# What the published crate carries: what it builds from.
include = ["src/**", "README.md", "LICENSE"]

[features]
# Noise_XX in place of TLS 1.3, for the whole build: both ends must be built
# alike (cargo chumby / cargo neochumbyd --features neochumby-proto/noise).
# Untested: CI neither builds nor tests it.
noise = ["dep:snow"]

[dependencies]
postcard.workspace = true
serde.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Pure Rust (no ring), so it builds for the Chumby as for servers.
snow = { version = "0.10", optional = true, default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
] }

[lints]
workspace = true
