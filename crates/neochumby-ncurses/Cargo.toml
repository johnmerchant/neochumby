[package]
name = "neochumby-ncurses"
description = "ncurses, built from source as a static library for the Chumby, for the apps that link curses programs"
# This crate is MIT; ncurses (third_party/ncurses, packaged with it) is
# under its X11-style licence (its COPYING), and its build carries
# install-sh (X11), configure (generated by autoconf: FSFUL) and
# config.guess and config.sub (GPL-3.0-or-later with the Autoconf exception,
# which lets them be distributed on ncurses' own terms).
license = "MIT AND X11-distribute-modifications-variant AND X11 AND FSFUL AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0"
# Its own semver, not the workspace's: published on crates.io (see
# CONTRIBUTING.md).
version = "0.0.1"
edition.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords = ["chumby", "ncurses", "curses", "embedded"]
categories = ["external-ffi-bindings", "embedded"]
# What the published crate carries: what it builds from, and ncurses'
# sources less what build.rs configures out (Ada95, c++, test, man pages
# but the three files configure writes from), its documentation and its
# packaging.
include = [
    "src/**",
    "build.rs",
    "csrc/**",
    "README.md",
    "LICENSE",
    "third_party/ncurses/**",
    "!third_party/ncurses/Ada95/**",
    "!third_party/ncurses/c++/**",
    "!third_party/ncurses/doc/**",
    "!third_party/ncurses/test/**",
    "!third_party/ncurses/package/**",
    "!third_party/ncurses/NEWS",
    "!third_party/ncurses/man/**",
    "third_party/ncurses/man/MKterminfo.sh",
    "third_party/ncurses/man/MKncu_config.in",
    "third_party/ncurses/man/man_db.renames.in",
]
# DEP_NCURSESW_INCLUDE, its headers, for the crates that build C against it.
links = "ncursesw"

[build-dependencies]
cc = "1"

[lints]
workspace = true
