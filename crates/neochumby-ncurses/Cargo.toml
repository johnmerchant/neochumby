[package]
name = "neochumby-ncurses"
description = "ncurses, built from source as a static library for the Chumby, for the apps that link curses programs"
# ncurses is under the X11 licence (MIT-style), as this crate is.
license = "MIT AND X11-distribute-modifications-variant"
version.workspace = true
edition.workspace = true
publish.workspace = true
# DEP_NCURSESW_INCLUDE, its headers, for the crates that build C against it.
links = "ncursesw"

[build-dependencies]
cc = "1"

[lints]
workspace = true
