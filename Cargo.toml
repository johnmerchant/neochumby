[workspace]
resolver = "3"
# Its own workspace: Buildroot builds it for the dist image without the
# apps, whose third-party crates are submodules.
exclude = ["crates/neochumby-init"]
members = [
    "crates/neochumby",
    "crates/neochumby-macros",
    "crates/neochumby-manifest",
    "crates/neochumby-ncurses",
    "crates/neochumby-proto",
    "crates/neochumby-softfloat",
    "crates/neochumby-sync",
    "crates/neochumby-sys",
    "crates/neochumbyd",
    "apps/airplay",
    "apps/airplay/proto",
    "apps/bonsai",
    "apps/aquarium",
    "apps/home",
    "apps/logs",
    "apps/classic",
    "apps/doom",
    "apps/fetch",
    "apps/genact",
    "apps/htop",
    "apps/cmatrix",
    "apps/clock",
    "apps/pipes",
    "apps/quake",
    "apps/top",
]

# The bundle's releases are dated (vYYYY.MM.N); this version is only for
# the crates that aren't published. The SDK crates published on crates.io
# (neochumby and the neochumby-* crates it needs, and neochumby-ncurses)
# each have their own semver version: see CONTRIBUTING.md.
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/johnmerchant/neochumby"

[workspace.dependencies]
libc = "0.2"
# Published crates: a path for the workspace, a version for crates.io. The
# versions are floors: CI publishes at its own (see CONTRIBUTING.md).
neochumby = { path = "crates/neochumby", version = "0.0.1" }
neochumby-macros = { path = "crates/neochumby-macros", version = "0.0.1" }
neochumby-ncurses = { path = "crates/neochumby-ncurses", version = "0.0.1" }
neochumby-softfloat = { path = "crates/neochumby-softfloat", version = "0.0.1" }
neochumby-proto = { path = "crates/neochumby-proto", version = "0.0.1" }
neochumby-sync = { path = "crates/neochumby-sync", version = "0.0.1" }
neochumby-sys = { path = "crates/neochumby-sys", version = "0.0.1" }
# AirPlay's messages: for its halves, and for frontends in other
# repositories (not published yet).
neochumby-airplay-proto = { path = "apps/airplay/proto" }
# What an app and its companion send each other (neochumby_proto::channel).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# No unsafe code outside neochumby-sys (and the games, FFI to C engines):
# see neochumby-sys and CONTRIBUTING.md. Deny, not forbid, so that those
# crates can allow it.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
# Symbols and line tables stay: crash addresses and profiles are looked up
# against them. They cost nothing on the device, where binaries are paged in
# over NFS and the debug sections are never read.
strip = false
debug = "line-tables-only"
