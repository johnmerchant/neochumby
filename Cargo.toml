[workspace]
resolver = "3"
members = [
    "crates/neochumby",
    "crates/neochumby-manifest",
    "crates/neochumby-proto",
    "crates/neochumby-softfloat",
    "crates/neochumby-sync",
    "crates/neochumby-sys",
    "crates/neochumbyd",
    "apps/airplay",
    "apps/home",
    "apps/doom",
    "apps/quake",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
libc = "0.2"
neochumby = { path = "crates/neochumby" }
neochumby-softfloat = { path = "crates/neochumby-softfloat" }
neochumby-proto = { path = "crates/neochumby-proto" }
neochumby-sync = { path = "crates/neochumby-sync" }
neochumby-sys = { path = "crates/neochumby-sys" }

# No unsafe code outside neochumby-sys (and the games, FFI to C engines):
# see neochumby-sys and CONTRIBUTING.md. Deny, not forbid, so that those
# crates can allow it.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
# Symbols and line tables stay: crash addresses and profiles are looked up
# against them. They cost nothing on the device, where binaries are paged in
# over NFS and the debug sections are never read.
strip = false
debug = "line-tables-only"
